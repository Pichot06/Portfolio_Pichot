baseURL: "https://Pichot06.github.io/Portfolio_Pichot/"
relativeURLs: false
canonifyURLs: false
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
languageCode: en-us
title: Alexandre Pichot

theme:
  - PaperMod

caches:
  images:
    dir: :cacheDir/images

# Paramètres globaux
params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowDate: true
  author: Alexandre Pichot
  images: ["1739734917588.jpg"]
  displayFullLangName: true
  mainSections:
    - projects
  assets:
    customCSS:
      - "css/extended/custom.css"

languages:
  en:
    languageName: English
    weight: 10
    title: Alexandre
    contentDir: content/en
    menu:
      main:
        - identifier: home
          name: 🏠 Home
          url: ""
          weight: 10
        - identifier: about
          name: 🙂 About
          url: about/
          weight: 20
        - identifier: personal-projects
          name: 🔧 Personal projects
          url: personal-projects/
          weight: 30
        - identifier: academic-projects
          name: 🎓 Academic projects
          url: academic-projects/
          weight: 40
    params:
      ShowReadingTime: true
      images: ["pichot.jpg"]
      profileMode:
        enabled: true
        title: "Alexandre Pichot"
        subtitle: "Fourth-year engineering student at INSA Hauts-de-France, specializing in Electrical Engineering and Industrial Computing, looking for a 3-month internship abroad starting in the last week of April in electronics or industrial computing."
