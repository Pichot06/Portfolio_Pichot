      socialIcons:
        - name: linkedin
          url: "https://www.linkedin.com/in/alexandre-pichot-a81360233/"
        - name: github
          url: "https://github.com/Pichot06"
        - name: email
          url: "mailto:alexandre.pichotx@gmail.com"
